<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard – NetAcad-Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css">
  <script defer src="/app.js"></script>
</head>

<body class="page">
<header class="site-header">
  <div class="logo">NetAcad-Quiz</div>

  <button class="menu-toggle" aria-label="Menü öffnen" type="button">☰ Menü</button>

  <nav class="site-nav" data-nav>
    <a href="/index.html">Home</a>
    <a href="/overview.html" class="active">Dashboard</a>
    <a href="/profile.html">Profil</a>
    <a href="/support.html">Support</a>
  </nav>
</header>

<main class="main">
  <section class="card">
    <div class="section-head">
      <h1>Kapitel</h1>

      <div class="controls">
        <label class="control">
          <span>Filter</span>
          <select id="chapter-filter">
            <option value="all">Alle</option>
            <option value="open">Nicht abgeschlossen</option>
            <option value="done">Abgeschlossen</option>
            <option value="faulty">Fehlerhaft</option>
            <option value="timeouts">Timeouts</option>
          </select>
        </label>
      </div>
    </div>

    <div class="chapter-list" id="chapter-list">
      <p class="muted">Lade Kapitel …</p>
    </div>
  </section>

  <section class="card">
    <h2>Oversight</h2>

    <div class="mode-box">
      <div class="mode-row">
        <div class="mode-label">Mode: <strong id="mode-label">Off</strong></div>
      </div>

      <div class="mode-slider-wrap">
        <input id="mode-slider" type="range" min="0" max="3" step="1" value="0" />
        <div class="mode-ticks">
          <span>Off</span>
          <span>Easy</span>
          <span>Medium</span>
          <span>Study</span>
        </div>
      </div>

      <p class="muted">
        Tipp: Klick auf ein Kapitel öffnet das Quiz. “Details” zeigt Fragen/Dauer/Timeouts (kommt als nächstes).
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© 2025 NetAcad-Quiz</small>
</footer>
</body>
</html>
