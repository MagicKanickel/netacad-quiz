<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Login – NetAcad-Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/index.css">
  <script defer src="/app.js"></script>
</head>

<body class="page">
<header class="site-header">
  <div class="logo">NetAcad-Quiz</div>

  <button class="menu-toggle" aria-label="Menü öffnen" type="button">☰ Menü</button>

  <nav class="site-nav" data-nav>
    <a href="/index.html">Home</a>
    <a href="/overview.html">Dashboard</a>
    <a href="/profile.html">Profil</a>
    <a href="/support.html">Support</a>
  </nav>
</header>

<main class="main">
  <section class="card hero">
    <div class="hero-main">
      <h1>Login</h1>
      <p class="hero-sub">
        Melde dich mit deiner Schul-E-Mail und deinem Passwort an.
      </p>

      <form id="login-form" class="form hero-form">
        <label class="form-field">
          <span>E-Mail-Adresse</span>
          <input
            type="email"
            id="login-email"
            required
            autocomplete="email"
            placeholder="230050@studierende.htl-donaustadt.at"
          />
        </label>

        <label class="form-field">
          <span>Passwort</span>
          <input
            type="password"
            id="login-password"
            required
            minlength="6"
            autocomplete="current-password"
            placeholder="Mindestens 6 Zeichen"
          />
        </label>

        <label class="form-check">
          <input type="checkbox" id="login-remember" />
          <span>Keep me logged in</span>
        </label>

        <button type="submit" class="btn-primary hero-btn">
          ➜ Zum Dashboard
        </button>

        <p id="login-error" class="form-error" aria-live="polite"></p>

        <!-- NEU: Link zur Registrierung -->
        <p class="muted" style="margin: 6px 0 0 0;">
          Noch kein Konto? <a href="/register.html">Jetzt registrieren</a>
        </p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© 2025 NetAcad-Quiz</small>
</footer>
</body>
</html>
