<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Registrieren – NetAcad-Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css">
  <script defer src="/app.js"></script>
</head>

<body class="page">
<header class="site-header">
  <div class="logo">NetAcad-Quiz</div>

  <button class="menu-toggle" aria-label="Menü öffnen" type="button">☰ Menü</button>

  <nav class="site-nav" data-nav>
    <a href="/index.html">Home</a>
    <a href="/overview.html">Dashboard</a>
    <a href="/profile.html">Profil</a>
    <a href="/support.html">Support</a>
  </nav>
</header>

<main class="main">
  <section class="card hero">
    <div class="hero-main">
      <h1>Registrieren</h1>
      <p class="hero-sub">
        Erstelle ein Konto mit deiner Schul-E-Mail. Danach wirst du automatisch angemeldet.
      </p>

      <form id="register-form" class="form hero-form">
        <label class="form-field">
          <span>E-Mail-Adresse</span>
          <input
            type="email"
            id="reg-email"
            required
            autocomplete="email"
            placeholder="230050@studierende.htl-donaustadt.at"
          />
        </label>

        <label class="form-field">
          <span>Passwort</span>
          <input
            type="password"
            id="reg-password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Mindestens 6 Zeichen"
          />
        </label>

        <label class="form-field">
          <span>Passwort wiederholen</span>
          <input
            type="password"
            id="reg-password2"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Nochmals eingeben"
          />
        </label>

        <button type="submit" class="btn-primary hero-btn">
          ➜ Konto erstellen
        </button>

        <p id="register-error" class="form-error" aria-live="polite"></p>

        <p class="muted" style="margin: 6px 0 0 0;">
          Schon ein Konto? <a href="/login.html">Zum Login</a>
        </p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© 2025 NetAcad-Quiz</small>
</footer>
</body>
</html>
