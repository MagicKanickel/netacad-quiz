<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Registrieren – NetAcad-Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css">
  <script defer src="/app.js"></script>
</head>

<body class="page">
<header class="site-header">
  <div class="logo">NetAcad-Quiz</div>
  <button class="menu-toggle" aria-label="Menü öffnen" type="button">☰ Menü</button>
  <nav class="site-nav" data-nav>
    <a href="/index.html">Home</a>
    <a href="/login.html">Login</a>
    <a href="/register.html" class="active">Registrieren</a>
    <a href="/support.html">Support</a>
  </nav>
</header>

<main class="main">
  <section class="card hero">
    <div class="hero-main">
      <h1>Registrieren</h1>
      <p class="hero-sub">Nur Schul-E-Mail-Adresse erlaubt.</p>

      <form id="register-form" class="form hero-form">
        <label class="form-field">
          <span>E-Mail-Adresse</span>
          <input id="register-email" type="email" required placeholder="230050@studierende.htl-donaustadt.at" />
        </label>

        <label class="form-field">
          <span>Passwort</span>
          <input id="register-password" type="password" required minlength="6" placeholder="Mindestens 6 Zeichen" />
        </label>

        <label class="form-check">
          <input type="checkbox" id="register-remember" />
          <span>Keep me logged in</span>
        </label>

        <button type="submit" class="btn-primary hero-btn">➜ Account erstellen</button>
        <p id="register-error" class="form-error" aria-live="polite"></p>

        <p class="muted" style="margin-top:12px">
          Schon registriert? <a href="/login.html">Zum Login</a>
        </p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© 2025 NetAcad-Quiz</small>
</footer>
</body>
</html>
