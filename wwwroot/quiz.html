<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Quiz – NetAcad-Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css">
  <script defer src="/app.js"></script>
</head>

<body class="page">
<header class="site-header">
  <div class="logo">NetAcad-Quiz</div>

  <button class="menu-toggle" aria-label="Menü öffnen" type="button">☰ Menü</button>

  <nav class="site-nav" data-nav>
    <a href="/index.html">Home</a>
    <a href="/overview.html">Dashboard</a>
    <a href="/profile.html">Profil</a>
    <a href="/support.html">Support</a>
  </nav>
</header>

<main class="main">
  <section class="card quiz-card">
    <div class="quiz-top">
      <div>
        <h1 id="quiz-title">Quiz</h1>
        <p class="muted" id="quiz-subtitle">Lade …</p>
      </div>

      <div class="timer" id="timer">
        <span class="timer-icon">⏱</span>
        <span id="timer-value">--</span>
      </div>
    </div>

    <div id="quiz-content">
      <p class="muted">Lade Fragen …</p>
    </div>

    <div class="question-nav" id="question-nav"></div>
  </section>
</main>

<footer class="site-footer">
  <small>© 2025 NetAcad-Quiz</small>
</footer>
</body>
</html>
