<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Quiz – NetAcad-Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/main.css">
  <script defer src="/app.js"></script>
</head>

<body class="page">
<header class="site-header">
  <div class="logo">NetAcad-Quiz</div>
  <button class="menu-toggle" aria-label="Menü öffnen" type="button">☰ Menü</button>
  <nav class="site-nav" data-nav>
    <a href="/overview.html">Dashboard</a>
    <a href="/profile.html">Profil</a>
    <a href="/support.html">Support</a>
  </nav>
</header>

<main class="main" id="quiz-root">
  <section class="card quiz-card">
    <div class="row-between">
      <div>
        <h1 id="quiz-chapter">Quiz</h1>
        <div class="muted" id="multi-hint"></div>
      </div>

      <div class="timer">
        <span id="timer-icon">⏱</span>
        <span id="timer">0:00</span>
      </div>
    </div>

    <div class="divider"></div>

    <h2 class="qtext" id="q-text">Lade Frage …</h2>

    <div id="answers" class="answers"></div>

    <button id="btn-confirm" class="btn-primary" type="button" style="display:none;margin-top:14px">
      Auswahl bestätigen
    </button>

    <div class="divider"></div>

    <div id="question-nav" class="qnav"></div>
  </section>

  <div id="timeout-overlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-text">Zeit abgelaufen</div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <small>© 2025 NetAcad-Quiz</small>
</footer>
</body>
</html>
